<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Winnow</title>
		<style>
			body {
				font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				width: 320px;
				margin: 0;
				padding: 14px 16px;
				color: #1f2328;
			}
			header {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 4px;
			}
			header img { width: 20px; height: 20px; border-radius: 5px; }
			h1 { font-size: 14px; margin: 0; }
			p { color: #59636e; margin: 6px 0; }
			h2 {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: #59636e;
				margin: 1.2em 0 0.5em;
			}
			.row { display: flex; gap: 8px; }
			input[type="text"] {
				flex: 1;
				font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
				padding: 8px 10px;
				border: 1px solid #d1d9e0;
				border-radius: 6px;
				color: inherit;
				background: #fff;
			}
			input[type="text"]:focus {
				outline: 2px solid #0969da;
				outline-offset: -1px;
			}
			button {
				font: 500 13px/1 inherit;
				border: 0;
				border-radius: 6px;
				padding: 9px 14px;
				cursor: pointer;
			}
			button.primary { background: #1f883d; color: #fff; }
			button.primary:disabled { background: #94d3a2; cursor: default; }
			ul#list {
				list-style: none;
				margin: 10px 0 0;
				padding: 0;
				border: 1px solid #d1d9e0;
				border-radius: 6px;
				max-height: 200px;
				overflow-x: hidden;
				overflow-y: auto;
			}
			ul#list:empty { display: none; }
			#list li {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				padding: 8px 12px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 13px;
			}
			#list li + li { border-top: 1px solid #d1d9e0; }
			#list li button {
				background: transparent;
				color: #59636e;
				padding: 2px 8px;
				font-size: 16px;
				line-height: 1;
			}
			#list li button:hover { color: #cf222e; }
			#empty {
				margin-top: 10px;
				padding: 14px;
				border: 1px dashed #d1d9e0;
				border-radius: 6px;
				color: #818b98;
				font-size: 13px;
				text-align: center;
			}
			#empty.is-hidden { display: none; }
			#status {
				display: inline-block;
				margin-top: 10px;
				color: #1a7f37;
				font-size: 13px;
				min-height: 1.4em;
			}
			@media (prefers-color-scheme: dark) {
				body { background: #0d1117; color: #e6edf3; }
				p, h2 { color: #9198a1; }
				input[type="text"] { background: #0d1117; color: #e6edf3; border-color: #3d444d; }
				ul#list { border-color: #3d444d; }
				#list li + li { border-color: #3d444d; }
				#empty { border-color: #3d444d; color: #6e7681; }
				button.primary:disabled { background: #1a5c30; color: #9198a1; }
			}
		</style>
	</head>
	<body>
		<header>
			<img src="icons/icon48.png" alt="" />
			<h1>Winnow</h1>
		</header>
		<p>
			Bots installed as GitHub Apps are detected automatically. Reviewers that post
			through an OAuth app look like ordinary user accounts, so add those logins
			below.
		</p>

		<h2>Muted logins</h2>
		<div class="row">
			<input
				type="text"
				id="input"
				spellcheck="false"
				autocomplete="off"
				placeholder="sonarcloud"
			/>
			<button class="primary" id="add" disabled>Add</button>
		</div>
		<ul id="list"></ul>
		<p id="empty">No logins added yet.</p>
		<span id="status"></span>

		<script src="popup.js"></script>
	</body>
</html>
